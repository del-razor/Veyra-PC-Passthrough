name: Passthrough release

# Builds this fork's player (veyra_qml_ui.exe + qml/Veyra) and drops it into
# the official NVIDIA and AMD portable packages of the same upstream version
# (Likely7/Veyra-NRVideo releases), then builds a Setup EXE for each.
# Each push to the passthrough branch replaces the draft release vX.Y.Z;
# publishing that draft creates the tag.

on:
  workflow_dispatch:
  push:
    branches: ['passthrough']

permissions:
  contents: write

concurrency:
  group: passthrough-release-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_COMMIT: 30ef65cad98f08e7197c9a1656fbd871bcb72f2d   # = vcpkg.json builtin-baseline
  QT_VERSION: '6.8.3'
  CARGO_C_VERSION: '0.10.26'
  UPSTREAM: Likely7/Veyra-NRVideo

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 340
    defaults:
      run:
        shell: pwsh -NoProfile -Command "New-Item -ItemType Directory -Force C:\logs | Out-Null; $log = 'C:\logs\step-' + (Get-Date -Format 'HHmmss-fff') + '.log'; $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true; try {{ . '{0}' *>&1 | Tee-Object -FilePath $log }} catch {{ ($_ | Out-String) | Add-Content $log; Write-Host ('::error title=step failed::' + (($_ | Out-String) -replace '\r?\n', '%0A')); throw }}"
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Stage pinned SDK headers and import libraries
        run: |
          if (Test-Path third_party_local) { throw 'third_party_local must not be tracked in Git' }
          scripts/ci/fetch-sdks.ps1 -VeyraRoot . -WorkRoot C:\sdk-src -ManifestOut C:\sdk-manifest.json

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@d325aaf2a8baeeda41ad0b5d39f84a6af9bcf005 # v4.3.0
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          cache: false

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Restore cargo-c
        id: cargo-c-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~\.cargo\bin\cargo-c*
          key: cargo-c-${{ env.CARGO_C_VERSION }}-v1

      - name: Build libdovi 3.4.0 from source
        run: |
          if ('${{ steps.cargo-c-cache.outputs.cache-hit }}' -ne 'true') {
            cargo install cargo-c --version $env:CARGO_C_VERSION --locked
          }
          Push-Location (Join-Path $env:DOVI_SOURCE 'dolby_vision')
          cargo cinstall --release --locked --prefix C:\dovi --library-type cdylib
          Pop-Location
          # find_library() looks for dovi.lib; cargo-c names the MSVC import library dovi.dll.lib.
          if (-not (Test-Path C:\dovi\lib\dovi.lib) -and (Test-Path C:\dovi\lib\dovi.dll.lib)) {
            Copy-Item C:\dovi\lib\dovi.dll.lib C:\dovi\lib\dovi.lib
          }
          if (-not (Test-Path C:\dovi\include\libdovi\rpu_parser.h)) { throw 'libdovi header missing' }
          Get-ChildItem C:\dovi -Recurse -File | Select-Object -ExpandProperty FullName

      - name: Save cargo-c
        if: steps.cargo-c-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~\.cargo\bin\cargo-c*
          key: cargo-c-${{ env.CARGO_C_VERSION }}-v1

      - name: Fetch vcpkg at the builtin-baseline and prepare the patched FFmpeg port
        run: |
          git init -q C:\v
          git -C C:\v remote add origin https://github.com/microsoft/vcpkg.git
          git -C C:\v fetch -q --depth 1 origin $env:VCPKG_COMMIT
          git -C C:\v -c advice.detachedHead=false checkout -q FETCH_HEAD
          C:\v\bootstrap-vcpkg.bat -disableMetrics
          python scripts/ci/make-ffmpeg-overlay.py C:\v . C:\vcpkg-overlay
          $all = (Get-ChildItem C:\vcpkg-overlay -Recurse -File | Get-FileHash | ForEach-Object Hash) -join ''
          "OVERLAY_HASH=$([Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($all))))" >> $env:GITHUB_ENV

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: C:\vcache
          key: vcpkg-${{ env.VCPKG_COMMIT }}-${{ env.OVERLAY_HASH }}-v1

      - name: Build FFmpeg 9.0.1 (slices256, deinterlace, D3D12VA reference pool), dav1d, zlib and libass
        env:
          VCPKG_BINARY_SOURCES: clear;files,C:\vcache,readwrite
          VCPKG_DISABLE_METRICS: '1'
        run: |
          New-Item -ItemType Directory -Force C:\vcache | Out-Null
          # --classic: vcpkg.json in the repo root would otherwise force manifest mode.
          C:\v\vcpkg.exe install --classic --overlay-ports=C:\vcpkg-overlay --clean-after-build `
            'ffmpeg[core,avcodec,avformat,avfilter,swresample,swscale,dav1d,zlib]:x64-windows' `
            'libass:x64-windows-static'
          $list = C:\v\vcpkg.exe list --classic
          $list | Set-Content -Encoding utf8 C:\vcpkg-list.txt
          $list | Write-Host
          if (-not ($list -match '^ffmpeg:x64-windows')) { throw 'ffmpeg not installed' }

      - name: Save vcpkg binary cache
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: C:\vcache
          key: vcpkg-${{ env.VCPKG_COMMIT }}-${{ env.OVERLAY_HASH }}-v1

      - name: Stage CUDA driver headers (NVIDIA VFG) and ONNX Runtime DirectML headers (RIFE)
        run: |
          python -m pip install --quiet --target C:\cuda-hdr nvidia-cuda-runtime-cu12==12.8.90
          $cuda = 'C:\cuda-hdr\nvidia\cuda_runtime\include'
          if (-not (Test-Path "$cuda\cuda.h")) { throw 'cuda.h missing' }
          "CUDA_INC=$cuda" >> $env:GITHUB_ENV
          foreach ($p in @(@{ id = 'Microsoft.ML.OnnxRuntime.DirectML'; v = '1.24.4'; dir = 'ort' }, @{ id = 'Microsoft.AI.DirectML'; v = '1.15.4'; dir = 'dml' })) {
            Invoke-WebRequest "https://www.nuget.org/api/v2/package/$($p.id)/$($p.v)" -OutFile "C:\$($p.dir).zip"
            Expand-Archive "C:\$($p.dir).zip" "C:\ort-dml\$($p.dir)" -Force
          }
          if (-not (Test-Path C:\ort-dml\ort\build\native\include\dml_provider_factory.h)) { throw 'ORT DirectML headers missing' }
          if (-not (Test-Path C:\ort-dml\dml\include\DirectML.h)) { throw 'DirectML headers missing' }

      - name: Configure (preset x64-release)
        run: |
          cmake --preset x64-release -B C:\b `
            -DVEYRA_BUILD_QML_UI=ON `
            -DVEYRA_ENABLE_EXPERIMENTAL_DLSSNR=ON `
            "-DVEYRA_DLSS_SDK_ROOT=$((Resolve-Path third_party_local/nvidia/DLSS_SDK_310.7.0).Path)" `
            -DVEYRA_FFMPEG_ROOT=C:/v/installed/x64-windows `
            -DVEYRA_LIBASS_ROOT=C:/v/installed/x64-windows-static `
            -DVEYRA_LIBDOVI_ROOT=C:/dovi `
            "-DVEYRA_CUDA_DRIVER_INCLUDE_DIR=$env:CUDA_INC" `
            -DVEYRA_ORT_DML_ROOT=C:/ort-dml `
            "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR"

      - name: Build veyra_qml_ui
        run: |
          New-Item -ItemType Directory -Force C:\logs | Out-Null
          cmake --build C:\b --parallel --target veyra_qml_ui *>&1 | Tee-Object -FilePath C:\logs\build.log | Select-Object -Last 400

      - name: Download the official packages of this version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Select-String -Path CMakeLists.txt -Pattern 'project\(veyra VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          "VERSION=$version" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force C:\official | Out-Null
          gh release download "v$version" -R $env:UPSTREAM -D C:\official -p '*-win64-portable.zip'
          gh release view "v$version" -R $env:UPSTREAM --json body --jq .body | Set-Content -Encoding utf8 C:\upstream-notes.md
          Get-ChildItem C:\official | Format-Table Name, Length | Out-String | Write-Host

      - name: Prepare Inno Setup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Veyra.iss uses directives from the current Inno Setup release (SetupArchitecture,
          # dark wizard styles), newer than the runner image's copy.
          $PSNativeCommandUseErrorActionPreference = $false
          gh release download -R jrsoftware/issrc -p 'innosetup-*.exe' -D C:\is-dl --clobber
          $PSNativeCommandUseErrorActionPreference = $true
          $installer = Get-ChildItem C:\is-dl\innosetup-*.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($installer) {
            Write-Host "Installing $($installer.Name)"
            $p = Start-Process $installer.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/CURRENTUSER', '/DIR=C:\inno' -Wait -PassThru
            $iscc = 'C:\inno\ISCC.exe'
          } else {
            choco upgrade innosetup -y --no-progress
            $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe", "$env:ProgramFiles\Inno Setup *\ISCC.exe" -ErrorAction SilentlyContinue | Sort-Object { $_.VersionInfo.FileVersionRaw } | Select-Object -Last 1 -ExpandProperty FullName
          }
          if (-not $iscc -or -not (Test-Path $iscc)) { throw 'Inno Setup install failed' }
          (Get-Item $iscc).VersionInfo | Format-List FileVersion, ProductVersion | Out-String | Write-Host
          $lang = Join-Path (Split-Path $iscc) 'Languages'
          foreach ($m in (Select-String -Path scripts/installer/Veyra.iss -Pattern 'compiler:Languages\\([A-Za-z]+\.isl)').Matches) {
            $f = $m.Groups[1].Value
            if (Test-Path (Join-Path $lang $f)) { continue }
            $ok = $false
            foreach ($u in "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/$f",
                           "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/$f") {
              try { Invoke-WebRequest $u -OutFile (Join-Path $lang $f); $ok = $true; break } catch { }
            }
            if (-not $ok) { throw "Inno Setup language file $f not available" }
          }
          "ISCC=$iscc" >> $env:GITHUB_ENV
          python -m pip install --quiet pillow

      - name: Repack NVIDIA and AMD packages with this player
        run: |
          New-Item -ItemType Directory -Force C:\release, C:\work | Out-Null
          foreach ($zip in Get-ChildItem C:\official\*-win64-portable.zip) {
            python scripts/passthrough/repack.py --official-zip $zip.FullName --build C:\b --output C:\release --iscc $env:ISCC --work C:\work
          }
          $n = (Get-ChildItem C:\release).Count
          if ($n -lt 4) { throw "expected NVIDIA and AMD zip + setup, got $n files" }
          Get-ChildItem C:\release | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName).Hash.ToLowerInvariant(), $_.Name } |
            Set-Content -Encoding utf8 C:\release\SHA256SUMS.txt
          Get-Content C:\release\SHA256SUMS.txt | Write-Host

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:VERSION"
          $notes = @"
          Veyra $env:VERSION with the Screen Capture game mode (mouse passthrough for PC / 3D games) kept.

          This is the official Veyra $env:VERSION from [$env:UPSTREAM](https://github.com/$env:UPSTREAM/releases/tag/$tag) with one change: the removal of the legacy mouse passthrough is undone. Everything else in $env:VERSION is unchanged. The NVIDIA and AMD packages are the official packages with the player rebuilt from this repository's ``passthrough`` branch (commit $env:GITHUB_SHA).

          Not included in this player build yet: PS5 Remote Play, Xbox and Moonlight streaming. The installer is not code-signed, and the in-app updater still follows the official releases.

          ---
          Upstream release notes:

          "@ + (Get-Content C:\upstream-notes.md -Raw)
          $notes | Set-Content -Encoding utf8 C:\notes.md
          $files = Get-ChildItem C:\release | ForEach-Object FullName
          $PSNativeCommandUseErrorActionPreference = $false
          $published = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select((.draft | not) and .tag_name == `"$tag`") | .id"
          if ($published) { throw "$tag is already published; delete it first to rebuild" }
          $drafts = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.draft and .tag_name == `"$tag`") | .id"
          foreach ($id in $drafts) { gh api -X DELETE "repos/$env:GITHUB_REPOSITORY/releases/$id" | Out-Null }
          $PSNativeCommandUseErrorActionPreference = $true
          gh release create $tag @files -F C:\notes.md -t "Veyra $env:VERSION (PC passthrough)" --draft --target $env:GITHUB_SHA

      - name: Publish logs for diagnosis
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force C:\logcopy | Out-Null
          Get-ChildItem C:\logs\*.log | ForEach-Object { Copy-Item $_.FullName C:\logcopy -ErrorAction SilentlyContinue }
          $steps = Get-ChildItem C:\logcopy\step-*.log | Sort-Object Name
          $failed = $steps | Select-Object -SkipLast 1 | Select-Object -Last 1
          if ($failed) {
            $tail = (Get-Content $failed.FullName | Where-Object { $_ -notmatch '^\*+$|^(Host Application|Process ID|PSVersion|PSEdition|GitCommitId|OS|Platform|PSCompatibleVersions|PSRemotingProtocolVersion|SerializationVersion|WSManStackVersion|Username|RunAs User|Configuration Name|Machine|Start time|End time|PowerShell transcript)' } | Select-Object -Last 25) -join '%0A'
            Write-Host "::error title=last step output::$tail"
          }
          if (Test-Path C:\logcopy\build.log) {
            $b = (Get-Content C:\logcopy\build.log | Select-String -Pattern 'error [A-Z]+[0-9]+:|FAILED:|fatal error|CMake Error' | Select-Object -Last 20 | ForEach-Object Line) -join '%0A'
            if ($b) { Write-Host "::error title=build errors::$b" }
          }
          Compress-Archive -Path C:\logcopy\* -DestinationPath C:\ci-logs.zip -Force
          gh release create "ci-logs-$env:GITHUB_RUN_ID" C:\ci-logs.zip --draft -t "CI logs $env:GITHUB_RUN_ID" -n "Build logs for a failed run." --target $env:GITHUB_SHA
